name: Sync card catalog

# The Grand Archive catalog is ~4,500 printings across ~151 API pages. At ~1.7s
# per page the fetch loop alone runs past Vercel's 300s function ceiling, so this
# sync runs here instead of as a Vercel cron.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and parse only — make no database writes"
        type: boolean
        default: false
      max_pages:
        description: "Limit the number of API pages (blank = all)"
        type: string
        default: ""

concurrency:
  # Never let two syncs write the catalog at once.
  group: sync-cards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # v5 is the first major of both actions to run on node24. On v4 the
      # runner force-migrates them off the deprecated node20 and emits a
      # warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Runtime for scripts/sync-cards.mjs, independent of the action
          # runtime above. Node 20 reached end of life in April 2026.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check required secrets
        # A real sync needs both secrets. Fail here with a named cause rather
        # than partway into the script, and say so as an annotation so the
        # reason shows on the run page instead of only in the log body.
        if: inputs.dry_run != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_URL:-}" ] || missing+=(SUPABASE_URL)
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            joined="${missing[*]}"
            echo "::error title=Missing repository secrets::Set these under Settings > Secrets and variables > Actions: ${joined}"
            {
              echo "### Missing repository secrets"
              echo
              for name in "${missing[@]}"; do echo "- \`${name}\`"; done
              echo
              echo "Add them under **Settings > Secrets and variables > Actions**, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Both required secrets are present."

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Passed as environment variables rather than interpolated into the
          # script body, so dispatch inputs can never be parsed as shell.
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${MAX_PAGES:-}" ]; then
            case "$MAX_PAGES" in
              ''|*[!0-9]*) echo "max_pages must be a positive integer" >&2; exit 1 ;;
            esac
            args+=(--max-pages "$MAX_PAGES")
          fi
          echo "Running: node scripts/sync-cards.mjs ${args[*]-}"
          node scripts/sync-cards.mjs "${args[@]}"
